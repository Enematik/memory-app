<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101522">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Memory</title>
<style>
  :root {
    --bg: #101522;
    --card-face: #f4f7fb;
    --accent: #4f8cff;
    --gold: #ffcc66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none; -moz-user-select: none; user-select: none; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #e8edf6;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 10px calc(12px + env(safe-area-inset-bottom));
    touch-action: manipulation; /* verhindert Doppel-Tap-Zoom */
    overscroll-behavior: none;
  }
  header { width: min(520px, 100%); text-align: center; margin-bottom: 10px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  #stats { display: flex; justify-content: center; gap: 18px; margin-top: 6px;
           font-size: 14px; color: #9fb0c7; }
  #stats b { color: #e8edf6; font-variant-numeric: tabular-nums; }

  #themachips { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { width: 58px; background: #1b2536; border: 1px solid #35476a; border-radius: 12px;
          padding: 6px 4px 5px; text-align: center; cursor: pointer; touch-action: manipulation; }
  .chip svg { width: 32px; height: 32px; display: block; margin: 0 auto 3px; }
  .chip span { font-size: 10px; color: #9fb0c7; display: block; line-height: 1.15; }
  .chip.active { border-color: var(--gold); background: #22314d; }
  .chip.active span { color: #e8edf6; }
  .chip:active { transform: scale(0.95); }

  #board {
    width: min(520px, 100vw - 20px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    aspect-ratio: 4 / 5;
  }
  .card { position: relative; touch-action: manipulation; }
  .inner {
    position: relative; width: 100%; height: 100%;
    animation: none;
  }
  .card.turning .inner { animation: flip 0.35s linear; }
  @keyframes flip { 0% { transform: scaleX(1); }
                    50% { transform: scaleX(0.04); }
                    100% { transform: scaleX(1); } }

  .face {
    position: absolute; inset: 0;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .back {
    background: linear-gradient(145deg, #33476b, #223049);
    border: 1px solid #45597c;
  }
  .back::after { content: "?"; font-size: 22px; font-weight: 700; color: #6a80a3; }

  .front { display: none; background: var(--card-face);
           font-size: clamp(26px, 8vw, 48px); }
  .card.flipped .back { display: none; }
  .card.flipped .front { display: flex; }

  .front svg { width: 74%; height: auto; border-radius: 3px; }

  .card.matched .front {
    background: #1d2a3d;
    border: 1px solid var(--gold);
    box-shadow: 0 0 10px rgba(255,204,102,.25);
    animation: pop 0.35s ease;
  }
  @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

  #controls { margin-top: 14px; display: flex; gap: 12px; }
  button {
    font-size: 15px; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 10px;
    padding: 11px 22px;
    touch-action: manipulation;
    font-family: inherit;
  }
  button:active { transform: scale(0.97); }
  button.secondary { background: #35476a; }

  #results { position: fixed; inset: 0; display: none; align-items: center;
             justify-content: center; background: rgba(10,14,22,.85); z-index: 5; }
  #results.show { display: flex; }
  #results .box { max-height: 78vh; overflow-y: auto; }
  .logrow { display: flex; justify-content: space-between; gap: 10px;
            padding: 6px 0; border-bottom: 1px solid #2c3b57; font-size: 13px; }
  .logrow .theme { color: #9fb0c7; }

  #win {
    position: fixed; left: 8px; right: 8px; z-index: 4;
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: none; justify-content: center;
  }
  #win.show { display: flex; }
  #win .box {
    background: #1b2536; border: 1px solid var(--gold); border-radius: 14px;
    padding: 10px 14px; display: flex; align-items: center; gap: 12px;
    max-width: 520px; width: 100%; text-align: left;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  #win h2 { font-size: 16px; margin: 0; white-space: nowrap; }
  #win p { color: #9fb0c7; margin: 0; font-size: 13px; line-height: 1.4; flex: 1; }
  #win button { padding: 9px 12px; font-size: 13px; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <h1>Memory <span style="font-size:12px;color:#9fb0c7;font-weight:600">v8</span></h1>
  <div id="stats">
    <span>Züge: <b id="moves">0</b></span>
    <span>Zeit: <b id="time">0:00</b></span>
    <span>Best: <b id="best">–</b></span>
  </div>
  <div id="themachips" aria-label="Motive">
    <div class="chip" data-theme="tiere" role="button" aria-label="Tiere">
      <svg viewBox="0 0 48 48" fill="#ffcc66"><ellipse cx="24" cy="30.5" rx="9.5" ry="7.5"/><circle cx="11.5" cy="19" r="4.2"/><circle cx="18.5" cy="13.5" r="4.2"/><circle cx="29.5" cy="13.5" r="4.2"/><circle cx="36.5" cy="19" r="4.2"/></svg>
      <span>Tiere</span>
    </div>
    <div class="chip" data-theme="sport" role="button" aria-label="Sport und Spiel">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="#f4f7fb" stroke="#35476a" stroke-width="2"/><polygon points="24,15 31.5,20.5 28.7,29.5 19.3,29.5 16.5,20.5" fill="#223049"/><path d="M24 7v8M41 24l-9.5-3.5M35 38l-6.3-8.5M13 38l6.3-8.5M7 24l9.5-3.5" stroke="#223049" stroke-width="2" fill="none"/></svg>
      <span>Sport</span>
    </div>
    <div class="chip" data-theme="flaggen" role="button" aria-label="Länder-Flaggen">
      <svg viewBox="0 0 48 48"><rect x="7" y="13" width="34" height="7" fill="#101010"/><rect x="7" y="20" width="34" height="7" fill="#d81e2c"/><rect x="7" y="27" width="34" height="8" fill="#ffce00"/><rect x="7" y="13" width="34" height="22" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>
      <span>Flaggen</span>
    </div>
    <div class="chip" data-theme="spielzeug" role="button" aria-label="Spielzeug">
      <svg viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="30" rx="6" fill="#f4f7fb" stroke="#35476a" stroke-width="2"/><circle cx="17" cy="17" r="3" fill="#223049"/><circle cx="24" cy="24" r="3" fill="#223049"/><circle cx="31" cy="31" r="3" fill="#223049"/></svg>
      <span>Spielzeug</span>
    </div>
    <div class="chip" data-theme="fische" role="button" aria-label="Fische">
      <svg viewBox="0 0 48 48"><ellipse cx="21" cy="24" rx="12" ry="8.5" fill="#4f8cff"/><polygon points="31,24 43,15 43,33" fill="#4f8cff"/><circle cx="15" cy="22" r="1.8" fill="#101522"/><path d="M18 27q6 4 12 0" stroke="#101522" stroke-width="1.5" fill="none"/></svg>
      <span>Fische</span>
    </div>
  </div>
  <select id="theme" style="display:none" aria-hidden="true">
    <option value="tiere">Tiere</option>
    <option value="sport">Sport &amp; Spiel</option>
    <option value="flaggen">Länder-Flaggen</option>
    <option value="spielzeug">Spielzeug</option>
    <option value="fische">Fische</option>
  </select>
</header>

<div id="board" aria-label="Spielfeld"></div>

<div id="controls">
  <button id="restart">Neue Runde</button>
  <button id="showlog" class="secondary">Ergebnisse</button>
</div>

<div id="win">
  <div class="box">
    <h2>Gewonnen! 🎉</h2>
    <p id="result"></p>
    <button id="again">Nochmal spielen</button>
  </div>
</div>

<div id="results">
  <div class="box">
    <h2>Ergebnisse</h2>
    <p id="themeBest"></p>
    <div id="log"></div>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
      <button id="clearlog" class="secondary">Bestenliste löschen</button>
      <button id="closelog">Schließen</button>
    </div>
  </div>
</div>

<script>
(function () {
  const THEMES = {
    tiere:     ["🐼","🐵","🐯","🦁","🐘","🐢","🦊","🐧","🐬","🦋"],
    sport:     ["⚽","🏀","🎾","🏈","🏐","🎱","🏓","🎯","🎳","🥇"],
    flaggen:   ["f-de","f-fr","f-gb","f-it","f-es","f-pt","f-no","f-jp","f-br","f-gr"],
    spielzeug: ["🧸","🎈","🪁","🧩","🎲","🚂","🛴","🪀","🎪","🪄"],
    fische:    ["🐟","🐠","🐡","🦈","🐙","🦀","🦞","🐳","🐬","🐚"]
  };
  const FLAGS = {
    "f-de": '<svg viewBox="0 0 60 40"><rect width="60" height="13.4" fill="#101010"/><rect y="13.3" width="60" height="13.4" fill="#d81e2c"/><rect y="26.6" width="60" height="13.4" fill="#ffce00"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-fr": '<svg viewBox="0 0 60 40"><rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#ffffff"/><rect x="40" width="20" height="40" fill="#ed2939"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-it": '<svg viewBox="0 0 60 40"><rect width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#ffffff"/><rect x="40" width="20" height="40" fill="#ce2b37"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-es": '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-pt": '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#da291c"/><rect width="24" height="40" fill="#046a38"/><circle cx="24" cy="20" r="6" fill="#ffcf2f" stroke="#da291c"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-no": '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#ba0c2f"/><rect x="16" width="12" height="40" fill="#ffffff"/><rect y="14" width="60" height="12" fill="#ffffff"/><rect x="19" width="6" height="40" fill="#00205b"/><rect y="17" width="60" height="6" fill="#00205b"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-gb": '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#012169"/><path d="M0 0 60 40M60 0 0 40" stroke="#ffffff" stroke-width="9"/><path d="M0 0 60 40M60 0 0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#ffffff" stroke-width="13"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="7"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-jp": '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#ffffff"/><circle cx="30" cy="20" r="8" fill="#bc002d"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-br": '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#009b3a"/><polygon points="30,5 55,20 30,35 5,20" fill="#fedf00"/><circle cx="30" cy="20" r="7" fill="#002776"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>',
    "f-gr": '<svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#ffffff"/><rect y="0" width="60" height="4.5" fill="#0d5eaf"/><rect y="9" width="60" height="4.5" fill="#0d5eaf"/><rect y="18" width="60" height="4.5" fill="#0d5eaf"/><rect y="27" width="60" height="4.5" fill="#0d5eaf"/><rect y="35.5" width="60" height="4.5" fill="#0d5eaf"/><rect width="20" height="20" fill="#0d5eaf"/><rect x="8" width="4" height="20" fill="#ffffff"/><rect y="8" width="20" height="4" fill="#ffffff"/><rect x="1" y="1" width="58" height="38" fill="none" stroke="#9fb0c7" stroke-width="2"/></svg>'
  };

  const themeSel = document.getElementById("theme");
  const THEME_KEY = "memory-theme";
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved && THEMES[saved]) themeSel.value = saved;
  } catch (e) {}
  function syncChips() {
    document.querySelectorAll(".chip").forEach(function (ch) {
      ch.classList.toggle("active", ch.getAttribute("data-theme") === themeSel.value);
    });
  }
  document.querySelectorAll(".chip").forEach(function (ch) {
    ch.addEventListener("click", function () {
      if (themeSel.value === ch.getAttribute("data-theme")) return;
      themeSel.value = ch.getAttribute("data-theme");
      themeSel.dispatchEvent(new Event("change"));
    });
  });
  themeSel.addEventListener("change", function () {
    try { localStorage.setItem(THEME_KEY, themeSel.value); } catch (e) {}
    newGame();
    showBest();
    syncChips();
  });
  const board = document.getElementById("board");
  const movesEl = document.getElementById("moves");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const winEl = document.getElementById("win");
  const resultEl = document.getElementById("result");

  let cards, moves, matched, first, lock, timer, seconds;

  function fmt(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

  function newGame() {
    clearInterval(timer);
    seconds = 0; moves = 0; matched = 0; first = null; lock = false;
    movesEl.textContent = "0";
    timeEl.textContent = "0:00";
    winEl.classList.remove("show");

    // mischen (Fisher–Yates)
    const EMOJIS = THEMES[themeSel.value] || THEMES.tiere;
    const faces = EMOJIS.concat(EMOJIS);
    for (let i = faces.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [faces[i], faces[j]] = [faces[j], faces[i]];
    }

    board.innerHTML = "";
    cards = [];
    faces.forEach(function (emoji) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="inner">' +
          '<div class="face back"></div>' +
          '<div class="face front">' + (FLAGS[emoji] || emoji) + '</div>' +
        '</div>';
      const c = { el: card, emoji: emoji, state: "down" };
      card._c = c;
      card.addEventListener("click", function () { onTap(card); });
      board.appendChild(card);
      cards.push(c);
    });
  }

  function startTimer() {
    timer = setInterval(function () {
      seconds++;
      timeEl.textContent = fmt(seconds);
    }, 1000);
  }

  function flipUp(c) {
    c.el.classList.add("turning");
    c.el.classList.add("flipped");
  }

  function flipDown(c) {
    c.el.classList.remove("flipped");
    c.el.classList.remove("turning");
  }

  function onTap(card) {
    const c = card._c;
    if (lock || c.state !== "down") return;
    if (seconds === 0) startTimer();

    c.state = "flipped";
    flipUp(c);

    if (!first) { first = c; return; }

    moves++;
    movesEl.textContent = moves;

    if (first.emoji === c.emoji) {
      first.state = c.state = "matched";
      first.el.classList.add("matched");
      card.classList.add("matched");
      first = null;
      matched += 2;
      if (matched === cards.length) win();
    } else {
      lock = true;
      const a = first, b = c;
      first = null;
      setTimeout(function () {
        flipDown(a);
        flipDown(b);
        a.state = b.state = "down";
        lock = false;
      }, 850);
    }
  }

  const THEME_NAMES = { tiere: "Tiere", sport: "Sport & Spiel", flaggen: "Länder-Flaggen",
                        spielzeug: "Spielzeug", fische: "Fische" };
  const LOG_KEY = "memory-log";
  let sessionLog = [];

  function loadLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); }
    catch (e) { return sessionLog.slice(); }
  }

  function saveResult() {
    const entry = { t: themeSel.value, m: moves, s: seconds, d: new Date().toISOString() };
    try {
      const l = loadLog();
      l.unshift(entry);
      if (l.length > 12) l.length = 12;
      localStorage.setItem(LOG_KEY, JSON.stringify(l));
    } catch (e) {
      sessionLog.unshift(entry);
      if (sessionLog.length > 12) sessionLog.length = 12;
    }
  }

  function bestKey() { return "memory-best-" + themeSel.value; }

  function win() {
    clearInterval(timer);
    let old = null;
    try { old = localStorage.getItem(bestKey()); } catch (e) {}
    const record = old === null || moves < Number(old);
    if (record) { try { localStorage.setItem(bestKey(), moves); } catch (e) {} }
    saveResult();
    showBest();
    resultEl.textContent = (record ? "Neuer Rekord für „" + THEME_NAMES[themeSel.value] + "“! " : "") +
                           "Du hast " + moves + " Züge in " + fmt(seconds) + " benötigt.";
    winEl.classList.add("show");
  }

  function showBest() {
    let v = null;
    try { v = localStorage.getItem(bestKey()); } catch (e) {}
    bestEl.textContent = v === null ? "–" : v;
  }

  function renderLog() {
    const log = loadLog();
    document.getElementById("themeBest").textContent =
      "Rekord „" + THEME_NAMES[themeSel.value] + "“: " +
      (bestEl.textContent === "–" ? "noch kein Spiel" : bestEl.textContent + " Züge");
    const box = document.getElementById("log");
    box.innerHTML = "";
    if (!log.length) {
      box.textContent = "Noch keine beendeten Runden.";
      return;
    }
    log.forEach(function (r) {
      const row = document.createElement("div");
      row.className = "logrow";
      const when = new Date(r.d).toLocaleString("de-DE",
        { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
      row.innerHTML = '<span class="theme">' + (THEME_NAMES[r.t] || r.t) + '</span>' +
                      '<span>' + r.m + ' Züge</span><span>' + fmt(r.s) + '</span>' +
                      '<span class="theme">' + when + '</span>';
      box.appendChild(row);
    });
  }

  document.getElementById("restart").addEventListener("click", newGame);
  document.getElementById("again").addEventListener("click", newGame);
  document.getElementById("showlog").addEventListener("click", function () {
    showBest(); renderLog();
    document.getElementById("results").classList.add("show");
  });
  document.getElementById("closelog").addEventListener("click", function () {
    document.getElementById("results").classList.remove("show");
  });
  document.getElementById("clearlog").addEventListener("click", function () {
    try {
      localStorage.removeItem(LOG_KEY);
      Object.keys(THEME_NAMES).forEach(function (k) { localStorage.removeItem("memory-best-" + k); });
      localStorage.removeItem("memory-best");
    } catch (e) {}
    sessionLog = [];
    showBest(); renderLog();
  });

  showBest();
  newGame();
  syncChips();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
