<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101522">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Memory</title>
<style>
  :root {
    --bg: #101522;
    --card-face: #f4f7fb;
    --accent: #4f8cff;
    --gold: #ffcc66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none; -moz-user-select: none; user-select: none; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #e8edf6;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
    touch-action: manipulation; /* verhindert Doppel-Tap-Zoom */
    overscroll-behavior: none;
  }
  header { width: min(520px, 100%); text-align: center; margin-bottom: 10px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  #stats { display: flex; justify-content: center; gap: 18px; margin-top: 6px;
           font-size: 14px; color: #9fb0c7; }
  #stats b { color: #e8edf6; font-variant-numeric: tabular-nums; }

  #board {
    width: min(520px, 100vw - 20px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    aspect-ratio: 4 / 5;
  }
  .card { position: relative; touch-action: manipulation; }
  .inner {
    position: relative; width: 100%; height: 100%;
    animation: none;
  }
  .card.turning .inner { animation: flip 0.35s linear; }
  @keyframes flip { 0% { transform: scaleX(1); }
                    50% { transform: scaleX(0.04); }
                    100% { transform: scaleX(1); } }

  .face {
    position: absolute; inset: 0;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .back {
    background: linear-gradient(145deg, #33476b, #223049);
    border: 1px solid #45597c;
  }
  .back::after { content: "?"; font-size: 22px; font-weight: 700; color: #6a80a3; }

  .front { display: none; background: var(--card-face);
           font-size: clamp(26px, 8vw, 48px); }
  .card.flipped .back { display: none; }
  .card.flipped .front { display: flex; }

  .card.matched .front {
    background: #1d2a3d;
    border: 1px solid var(--gold);
    box-shadow: 0 0 10px rgba(255,204,102,.25);
    animation: pop 0.35s ease;
  }
  @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

  #controls { margin-top: 14px; display: flex; gap: 12px; }
  button {
    font-size: 15px; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 10px;
    padding: 11px 22px;
    touch-action: manipulation;
    font-family: inherit;
  }
  button:active { transform: scale(0.97); }

  #win {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(10,14,22,.85);
  }
  #win.show { display: flex; }
  #win .box {
    background: #1b2536; border: 1px solid #35476a; border-radius: 16px;
    padding: 28px 30px; text-align: center; max-width: 84%;
  }
  #win h2 { font-size: 26px; margin-bottom: 10px; }
  #win p { color: #9fb0c7; margin-bottom: 18px; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>Memory <span style="font-size:12px;color:#9fb0c7;font-weight:600">v2</span></h1>
  <div id="stats">
    <span>Züge: <b id="moves">0</b></span>
    <span>Zeit: <b id="time">0:00</b></span>
    <span>Best: <b id="best">–</b></span>
  </div>
</header>

<div id="board" aria-label="Spielfeld"></div>

<div id="controls">
  <button id="restart">Neue Runde</button>
</div>

<div id="win">
  <div class="box">
    <h2>Gewonnen! 🎉</h2>
    <p id="result"></p>
    <button id="again">Nochmal spielen</button>
  </div>
</div>

<script>
(function () {
  const EMOJIS = ["🐼","🐵","🐯","🦁","🐘","🐢","🦊","🐧","🐬","🦋"];
  const board = document.getElementById("board");
  const movesEl = document.getElementById("moves");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const winEl = document.getElementById("win");
  const resultEl = document.getElementById("result");

  let cards, moves, matched, first, lock, timer, seconds;

  function fmt(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

  function newGame() {
    clearInterval(timer);
    seconds = 0; moves = 0; matched = 0; first = null; lock = false;
    movesEl.textContent = "0";
    timeEl.textContent = "0:00";
    winEl.classList.remove("show");

    // mischen (Fisher–Yates)
    const faces = EMOJIS.concat(EMOJIS);
    for (let i = faces.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [faces[i], faces[j]] = [faces[j], faces[i]];
    }

    board.innerHTML = "";
    cards = [];
    faces.forEach(function (emoji) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="inner">' +
          '<div class="face back"></div>' +
          '<div class="face front">' + emoji + '</div>' +
        '</div>';
      const c = { el: card, emoji: emoji, state: "down" };
      card._c = c;
      card.addEventListener("click", function () { onTap(card); });
      board.appendChild(card);
      cards.push(c);
    });
  }

  function startTimer() {
    timer = setInterval(function () {
      seconds++;
      timeEl.textContent = fmt(seconds);
    }, 1000);
  }

  function flipUp(c) {
    c.el.classList.add("turning");
    c.el.classList.add("flipped");
  }

  function flipDown(c) {
    c.el.classList.remove("flipped");
    c.el.classList.remove("turning");
  }

  function onTap(card) {
    const c = card._c;
    if (lock || c.state !== "down") return;
    if (seconds === 0) startTimer();

    c.state = "flipped";
    flipUp(c);

    if (!first) { first = c; return; }

    moves++;
    movesEl.textContent = moves;

    if (first.emoji === c.emoji) {
      first.state = c.state = "matched";
      first.el.classList.add("matched");
      card.classList.add("matched");
      first = null;
      matched += 2;
      if (matched === cards.length) win();
    } else {
      lock = true;
      const a = first, b = c;
      first = null;
      setTimeout(function () {
        flipDown(a);
        flipDown(b);
        a.state = b.state = "down";
        lock = false;
      }, 850);
    }
  }

  function win() {
    clearInterval(timer);
    const bestKey = "memory-best";
    const old = localStorage.getItem(bestKey);
    if (old === null || moves < Number(old)) {
      localStorage.setItem(bestKey, moves);
    }
    showBest();
    resultEl.textContent = "Du hast " + moves + " Züge in " + fmt(seconds) +
                           " benötigt.";
    winEl.classList.add("show");
  }

  function showBest() {
    const v = localStorage.getItem("memory-best");
    bestEl.textContent = v === null ? "–" : v;
  }

  document.getElementById("restart").addEventListener("click", newGame);
  document.getElementById("again").addEventListener("click", newGame);

  showBest();
  newGame();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
